<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <title>Günlükİş | İşveren Profili</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] }, colors: { brand: "#2563eb" } } } };
  </script>
  <style>
    body { background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    .glass-nav { background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226,232,240,0.8); }
    .smooth-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
    .notif-dropdown { position:absolute; top:55px; right:0; width:380px; max-width:90vw; max-height:70vh; background:white; border-radius:1.25rem; box-shadow:0 20px 50px rgba(0,0,0,0.15); border:1px solid #e2e8f0; z-index:60; display:none; flex-direction:column; overflow:hidden; }
    .notif-dropdown.open { display:flex; }
    #toast-container { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:10px; pointer-events:none; }
    .toast { background:#1e293b; color:white; padding:12px 24px; border-radius:100px; font-size:14px; font-weight:600; box-shadow:0 10px 25px rgba(0,0,0,.1); opacity:0; transform:translateY(20px); transition:all 0.3s ease; }
    .toast.show { opacity:1; transform:translateY(0); }
    .skel { background: linear-gradient(90deg,#e2e8f0 0%,#f1f5f9 50%,#e2e8f0 100%); background-size: 200% 100%; animation: skel 1.5s infinite; }
    @keyframes skel { 0%{background-position:0% 0%} 100%{background-position:-200% 0%} }
  </style>
</head>
<body class="text-slate-800 antialiased pb-20 md:pb-0">

  <!-- HEADER -->
  <header class="fixed top-0 left-0 right-0 z-50 glass-nav">
    <div class="max-w-7xl mx-auto px-4 lg:px-8">
      <div class="flex items-center justify-between h-16 md:h-20">
        <a href="index.html" class="flex items-center gap-3">
          <div class="bg-blue-600 p-2.5 rounded-xl shadow-lg shadow-blue-500/30"><i class="fa-solid fa-briefcase text-white text-sm"></i></div>
          <span class="text-xl font-extrabold tracking-tight text-slate-900">Günlükİş</span>
        </a>
        <div class="hidden md:flex items-center gap-4">
          <a href="is-ver.html" class="text-sm font-bold bg-slate-900 text-white px-6 py-2.5 rounded-full hover:bg-slate-800 transition shadow-md">İş Ver</a>
          <div class="w-px h-6 bg-slate-200 mx-2"></div>
          <div class="relative">
            <button onclick="toggleNotifications(event)" id="notif-bell-btn" class="relative p-2 text-slate-500 hover:text-slate-900 transition">
              <i class="fa-regular fa-bell text-xl"></i>
              <span id="notif-badge" class="hidden absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 border-2 border-white rounded-full"></span>
            </button>
            <div id="notif-dropdown" class="notif-dropdown"></div>
          </div>
          <div class="relative group cursor-pointer ml-2 py-4">
            <div class="flex items-center gap-2">
              <img id="header-avatar" src="https://i.pravatar.cc/150?img=32" alt="Profil" class="w-10 h-10 rounded-full object-cover border-2 border-slate-100 hover:border-blue-200 transition-colors" />
              <i class="fa-solid fa-chevron-down text-slate-400 text-[10px] transition-transform duration-300 group-hover:rotate-180"></i>
            </div>
            <div class="absolute right-0 top-full mt-[-5px] w-60 bg-white border border-slate-100 rounded-2xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.1)] opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 py-2 z-50">
              <a href="profil.html" class="block px-5 py-3 text-[15px] font-bold text-slate-800 hover:bg-slate-50 hover:text-blue-600 transition">Üye profiline git</a>
              <div class="h-px bg-slate-100 my-1"></div>
              <a href="profil.html#basvurularim" class="block px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition">Başvurularım</a>
              <a href="profil.html#favorilerim" class="block px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition">Favori İlanlarım</a>
              <div class="h-px bg-slate-100 my-1"></div>
              <a href="ayarlar.html" class="block px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition">Ayarlar</a>
              <button onclick="logoutUser()" class="w-full text-left block px-5 py-2.5 text-sm font-bold text-red-500 hover:bg-red-50 transition">Çıkış</button>
            </div>
          </div>
        </div>
        <div class="md:hidden flex items-center gap-4">
          <button onclick="toggleNotifications(event)" class="relative text-slate-500">
            <i class="fa-regular fa-bell text-xl"></i>
            <span id="notif-badge-mobile" class="hidden absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-red-500 border-2 border-white rounded-full"></span>
          </button>
          <a href="profil.html"><img id="header-avatar-m" src="https://i.pravatar.cc/150?img=32" alt="Profil" class="w-9 h-9 rounded-full object-cover border border-slate-200" /></a>
        </div>
      </div>
      <nav class="hidden md:flex items-center justify-center gap-10 h-14 text-sm font-bold text-slate-500 border-t border-slate-200/60">
        <a href="index.html" class="flex items-center gap-2 hover:text-slate-800 transition h-full"><i class="fa-solid fa-layer-group"></i> İşler</a>
        <a href="takvim.html" class="flex items-center gap-2 hover:text-slate-800 transition h-full"><i class="fa-regular fa-calendar"></i> Takvim</a>
        <a href="mesaj.html" class="flex items-center gap-2 hover:text-slate-800 transition h-full"><i class="fa-regular fa-message"></i> Mesajlar</a>
        <a href="anket.html" class="flex items-center gap-2 hover:text-slate-800 transition h-full"><i class="fa-solid fa-chart-simple"></i> Anket</a>
      </nav>
    </div>
  </header>

  <main class="pt-[80px] md:pt-[150px] px-4 lg:px-8 max-w-5xl mx-auto pb-16">

    <a href="javascript:history.back()" class="inline-flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-slate-800 mb-5">
      <i class="fa-solid fa-arrow-left"></i> Geri Dön
    </a>

    <!-- ── KULLANICI KARTI ── -->
    <div class="bg-white border border-slate-100 rounded-[2rem] p-6 md:p-8 smooth-shadow mb-6">
      <div class="flex flex-col md:flex-row items-start md:items-center gap-6">
        <div class="relative">
          <img id="user-avatar" src="" alt="Profil"
            class="w-24 h-24 md:w-28 md:h-28 rounded-3xl object-cover border-4 border-white shadow-lg" />
          <span id="user-online" class="hidden absolute bottom-2 right-2 w-4 h-4 bg-emerald-500 border-2 border-white rounded-full"></span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1.5 flex-wrap">
            <h1 id="user-name" class="text-2xl md:text-3xl font-extrabold text-slate-900">—</h1>
            <span id="user-verified" class="hidden text-blue-600">
              <i class="fa-solid fa-circle-check"></i>
            </span>
          </div>
          <p id="user-title" class="text-slate-500 font-semibold text-sm mb-3">—</p>
          <div class="flex flex-wrap items-center gap-4 text-xs font-bold text-slate-500">
            <span id="user-rating"><i class="fa-solid fa-star text-amber-400 mr-1"></i>—</span>
            <span class="text-slate-300">•</span>
            <span><strong id="followers-count" class="text-slate-800">0</strong> Takipçi</span>
            <span class="text-slate-300">•</span>
            <span><strong id="following-count" class="text-slate-800">0</strong> Takip</span>
            <span class="text-slate-300">•</span>
            <span id="user-location" class="flex items-center gap-1"><i class="fa-solid fa-location-dot"></i>—</span>
          </div>
        </div>
        <div class="flex flex-col md:flex-row gap-2 w-full md:w-auto">
          <button id="follow-btn" onclick="toggleFollow()"
            class="px-6 py-3 bg-blue-600 text-white font-bold text-sm rounded-xl hover:bg-blue-700 transition shadow-md shadow-blue-500/20 flex items-center justify-center gap-2 hidden">
            <i class="fa-solid fa-plus"></i> <span id="follow-btn-text">Takip Et</span>
          </button>
          <button onclick="askQuestion()" id="msg-btn"
            class="px-6 py-3 bg-white border-2 border-slate-200 text-slate-700 font-bold text-sm rounded-xl hover:border-blue-300 hover:text-blue-600 transition flex items-center justify-center gap-2 hidden">
            <i class="fa-regular fa-message"></i> Mesaj Gönder
          </button>
        </div>
      </div>

      <!-- Bio -->
      <div id="user-bio-wrap" class="mt-6 pt-6 border-t border-slate-100 hidden">
        <p id="user-bio" class="text-sm font-medium text-slate-600 leading-relaxed"></p>
      </div>
    </div>

    <!-- ── İLANLAR ── -->
    <div class="bg-white border border-slate-100 rounded-[2rem] p-6 md:p-8 smooth-shadow">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-extrabold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-briefcase text-blue-600"></i> Yayınlanan İlanlar
        </h2>
        <span id="jobs-count" class="text-xs font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full">0 ilan</span>
      </div>

      <div id="jobs-list" class="space-y-3">
        <div class="skel h-20 rounded-2xl"></div>
        <div class="skel h-20 rounded-2xl"></div>
        <div class="skel h-20 rounded-2xl"></div>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around items-center h-16 z-40">
    <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 w-1/4"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] font-bold">Ana Sayfa</span></a>
    <a href="takvim.html" class="flex flex-col items-center gap-1 text-slate-400 w-1/4"><i class="fa-regular fa-calendar text-lg"></i><span class="text-[10px] font-bold">Takvim</span></a>
    <a href="mesaj.html" class="flex flex-col items-center gap-1 text-slate-400 w-1/4"><i class="fa-regular fa-message text-lg"></i><span class="text-[10px] font-bold">Mesajlar</span></a>
    <a href="profil.html" class="flex flex-col items-center gap-1 text-slate-400 w-1/4"><i class="fa-regular fa-user text-lg"></i><span class="text-[10px] font-bold">Profil</span></a>
  </nav>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
    <script src="/js/mandatory-survey.js"></script>
  <script>
    const targetId = new URLSearchParams(location.search).get('id');
    let userData = null;

    function escapeHtml(s) {
      return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadProfile() {
      if (!targetId) {
        showToast('Kullanıcı ID eksik.', 'error');
        return;
      }
      try {
        const data = await apiGet('/api/jobs/users/' + targetId + '/public');
        userData = data;
        const u = data.user;

        document.title = 'Günlükİş | ' + u.full_name;
        document.getElementById('user-avatar').src = u.avatar_url || `https://i.pravatar.cc/150?img=${(u.id % 70) + 1}`;
        document.getElementById('user-name').textContent = u.full_name;
        document.getElementById('user-title').textContent = u.title || (u.role === 'employer' ? 'İşveren' : 'Üye');
        if (u.is_verified) document.getElementById('user-verified').classList.remove('hidden');
        if (u.is_online) document.getElementById('user-online').classList.remove('hidden');
        document.getElementById('user-rating').innerHTML =
          `<i class="fa-solid fa-star text-amber-400 mr-1"></i> ${parseFloat(u.rating_avg || 0).toFixed(1)} (${u.rating_count || 0} İşlem)`;
        document.getElementById('user-location').innerHTML =
          `<i class="fa-solid fa-location-dot"></i> ${escapeHtml([u.district, u.city].filter(Boolean).join(', ') || 'Belirtilmemiş')}`;
        document.getElementById('followers-count').textContent = data.followers_count;
        document.getElementById('following-count').textContent = data.following_count;

        if (u.bio) {
          document.getElementById('user-bio-wrap').classList.remove('hidden');
          document.getElementById('user-bio').textContent = u.bio;
        }

        // Takip / Mesaj butonları (kendi profili değilse)
        if (!data.is_self) {
          document.getElementById('follow-btn').classList.remove('hidden');
          document.getElementById('msg-btn').classList.remove('hidden');
          updateFollowBtn(data.is_following);
        }

        // İlanları render et
        renderJobs(data.jobs);
      } catch (err) {
        showToast('Profil yüklenemedi: ' + err.message, 'error');
        document.getElementById('jobs-list').innerHTML =
          `<div class="text-center py-8 text-rose-500 text-sm font-medium">${escapeHtml(err.message)}</div>`;
      }
    }

    function renderJobs(jobs) {
      const el = document.getElementById('jobs-list');
      const count = document.getElementById('jobs-count');
      count.textContent = jobs.length + ' ilan';

      if (jobs.length === 0) {
        el.innerHTML = `
          <div class="text-center py-12">
            <i class="fa-solid fa-briefcase text-3xl text-slate-300 mb-3"></i>
            <p class="text-slate-400 text-sm font-medium">Henüz yayınlanmış ilan yok.</p>
          </div>`;
        return;
      }

      const tagColors = {
        blue:    'bg-blue-50 text-blue-700 border-blue-100',
        emerald: 'bg-emerald-50 text-emerald-700 border-emerald-100',
        amber:   'bg-amber-50 text-amber-700 border-amber-100',
        rose:    'bg-rose-50 text-rose-700 border-rose-100',
        slate:   'bg-slate-50 text-slate-700 border-slate-100'
      };
      const months = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];

      el.innerHTML = jobs.map(j => {
        const d = new Date(j.work_date);
        const dateStr = `${d.getDate()} ${months[d.getMonth()]}`;
        const tagHtml = j.tags.map((t, i) => {
          const color = j.tag_colors[i] || 'blue';
          return `<span class="${tagColors[color] || tagColors.blue} px-2 py-0.5 rounded-md text-[10px] font-bold border">${escapeHtml(t)}</span>`;
        }).join('');

        return `
          <a href="is-detay.html?id=${j.id}" class="block bg-slate-50 hover:bg-white border border-transparent hover:border-slate-100 hover:shadow-sm rounded-2xl p-4 transition">
            <div class="flex items-center justify-between gap-4">
              <div class="flex-1 min-w-0">
                <h3 class="font-extrabold text-slate-900 text-sm mb-1 truncate">${escapeHtml(j.title)}</h3>
                <p class="text-xs text-slate-500 font-medium mb-2">
                  <i class="fa-solid fa-location-dot mr-1"></i>${escapeHtml([j.district, j.city].filter(Boolean).join(', '))}
                  · ${dateStr}
                  · ${j.applicant_count || 0} başvuru
                </p>
                <div class="flex flex-wrap gap-1.5">${tagHtml}</div>
              </div>
              <div class="text-right shrink-0">
                <p class="font-black text-slate-900 text-base">${new Intl.NumberFormat('tr-TR').format(j.budget)} ₺</p>
                <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">Bütçe</p>
              </div>
            </div>
          </a>`;
      }).join('');
    }

    function updateFollowBtn(isFollowing) {
      const btn = document.getElementById('follow-btn');
      const txt = document.getElementById('follow-btn-text');
      if (isFollowing) {
        btn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'shadow-blue-500/20');
        btn.classList.add('bg-white', 'border-2', 'border-emerald-500', 'text-emerald-600');
        txt.textContent = 'Takip Ediliyor';
        btn.querySelector('i').className = 'fa-solid fa-check';
      } else {
        btn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'shadow-blue-500/20');
        btn.classList.remove('bg-white', 'border-2', 'border-emerald-500', 'text-emerald-600');
        txt.textContent = 'Takip Et';
        btn.querySelector('i').className = 'fa-solid fa-plus';
      }
    }

    async function toggleFollow() {
      try {
        const res = await apiPost('/api/social/follow/' + targetId);
        updateFollowBtn(res.following);
        // Takipçi sayısını güncelle
        const cur = parseInt(document.getElementById('followers-count').textContent);
        document.getElementById('followers-count').textContent = res.following ? cur + 1 : Math.max(0, cur - 1);
        showToast(res.following ? 'Takip edildi 🎉' : 'Takipten çıkıldı');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function askQuestion() {
      try {
        const res = await apiPost('/api/social/conversations/start', { target_user_id: Number(targetId) });
        window.location.href = 'mesaj.html?conv=' + res.conversation_id;
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // ============== BİLDİRİMLER ==============
    async function toggleNotifications(e) {
      e?.stopPropagation();
      const dd = document.getElementById("notif-dropdown");
      if (!dd) return;
      if (dd.classList.contains("open")) { dd.classList.remove("open"); return; }
      dd.innerHTML = `<div class="p-4 text-center text-sm text-slate-400">Yükleniyor...</div>`;
      dd.classList.add("open");
      try {
        const data = await apiGet("/api/notifications");
        const items = data.items || [];
        dd.innerHTML = `<div class="flex items-center justify-between p-4 border-b border-slate-100"><h3 class="font-extrabold text-slate-900 text-sm"><i class="fa-regular fa-bell text-blue-600 mr-2"></i>Bildirimler</h3></div>` + (items.length === 0 ? `<div class="p-8 text-center text-sm text-slate-400">Henüz bildirim yok.</div>` : `<div class="overflow-y-auto" style="max-height:55vh">${items.map(n=>`<div class="flex gap-3 p-4 border-b border-slate-50 hover:bg-slate-50 ${n.is_read?"":"bg-blue-50/40"}"><div class="flex-1"><p class="text-sm font-bold text-slate-900">${n.title}</p><p class="text-[10px] text-slate-400 mt-0.5">${n.body||""}</p></div></div>`).join("")}</div>`);
      } catch (err) { dd.innerHTML = `<div class="p-4 text-xs text-rose-500 text-center">Yüklenemedi</div>`; }
    }
    document.addEventListener("click", e => { const dd=document.getElementById("notif-dropdown"); if(!dd?.classList.contains("open")) return; if(!dd.contains(e.target)&&!document.getElementById("notif-bell-btn")?.contains(e.target)) dd.classList.remove("open"); });
    async function loadNotifBadge() { try { const d=await apiGet("/api/notifications"); if(d.unread>0){document.getElementById("notif-badge")?.classList.remove("hidden");document.getElementById("notif-badge-mobile")?.classList.remove("hidden");} } catch(e){} }

    window.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      loadHeaderUser();
      loadNotifBadge();
    });
  </script>
</body>
</html>
