<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Günlükİş | Kayıt Ol</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Plus Jakarta Sans","sans-serif"] } } } };</script>
  <style>
    body { background:linear-gradient(135deg,#eff6ff 0%,#f8fafc 50%,#eff6ff 100%);min-height:100vh; }
    #toast-container { position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:10px; }
    .toast { background:#1e293b;color:white;padding:12px 24px;border-radius:100px;font-size:14px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,.12);opacity:0;transform:translateY(20px);transition:all .3s ease; }
    .toast.show { opacity:1;transform:translateY(0); }
    .input-field { width:100%;padding:12px 16px 12px 44px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;font-weight:500;transition:all .2s;color:#0f172a; }
    .input-field:focus { outline:none;border-color:#3b82f6;background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.1); }
    .btn-primary { width:100%;background:#2563eb;color:white;font-weight:700;font-size:14px;padding:13px;border-radius:12px;transition:all .2s;box-shadow:0 4px 12px rgba(37,99,235,.25); }
    .btn-primary:hover { background:#1d4ed8;transform:translateY(-1px); }
    .btn-primary:disabled { background:#93c5fd;cursor:not-allowed;transform:none; }
    .divider { display:flex;align-items:center;gap:12px;color:#94a3b8;font-size:13px;font-weight:600; }
    .divider::before,.divider::after { content:'';flex:1;height:1px;background:#e2e8f0; }
    .role-card { border:2px solid #e2e8f0;border-radius:12px;padding:16px;cursor:pointer;transition:all .2s;text-align:center; }
    .role-card:hover { border-color:#93c5fd;background:#eff6ff; }
    .role-card.selected { border-color:#2563eb;background:#eff6ff; }
    .role-card.selected .role-icon { background:#2563eb;color:white; }
    .role-icon { width:40px;height:40px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:18px;transition:all .2s; }
  </style>
</head>
<body class="font-sans antialiased flex items-center justify-center min-h-screen px-4 py-12">

  <div class="w-full max-w-[440px]">

    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-3 mb-6">
        <div class="bg-blue-600 p-3 rounded-2xl shadow-lg shadow-blue-500/30">
          <i class="fa-solid fa-briefcase text-white text-lg"></i>
        </div>
        <span class="text-2xl font-extrabold text-slate-900">Günlükİş</span>
      </a>
      <h1 class="text-2xl font-extrabold text-slate-900">Ücretsiz Hesap Oluştur</h1>
      <p class="text-slate-500 text-sm mt-1 font-medium">Saniyeler içinde kaydol, fırsatları kaçırma</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8">

      <!-- Google -->
      <div id="google-gsi-btn" class="flex justify-center mb-5"></div>
      <button id="google-fallback-btn" onclick="googleSignIn()"
        class="hidden w-full flex items-center justify-center gap-3 border-2 border-slate-200 text-slate-700 font-bold py-3 rounded-xl hover:border-blue-300 hover:bg-blue-50 transition text-sm mb-5">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Google ile Kaydol
      </button>

      <div class="divider mb-5">veya e-posta ile</div>

      <!-- Hesap Tipi -->
      <div class="mb-5">
        <p class="text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-3">Hesap Türü</p>
        <div class="grid grid-cols-2 gap-3">
          <div class="role-card selected" onclick="selectRole('worker',this)">
            <div class="role-icon"><i class="fa-solid fa-user-tie text-slate-500"></i></div>
            <p class="text-sm font-bold text-slate-800">İş Arayan</p>
            <p class="text-xs text-slate-500 mt-0.5">İş bul & başvur</p>
          </div>
          <div class="role-card" onclick="selectRole('employer',this)">
            <div class="role-icon"><i class="fa-solid fa-building text-slate-500"></i></div>
            <p class="text-sm font-bold text-slate-800">İşveren</p>
            <p class="text-xs text-slate-500 mt-0.5">İlan ver & işe al</p>
          </div>
        </div>
        <input type="hidden" id="selected-role" value="worker" />
      </div>

      <!-- Form -->
      <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
        <div class="relative">
          <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="reg-name" placeholder="Ad Soyad" class="input-field" required autocomplete="name" />
        </div>
        <div class="relative">
          <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="email" id="reg-email" placeholder="E-posta adresiniz" class="input-field" required autocomplete="email" />
        </div>
        <div class="relative">
          <i class="fa-solid fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="tel" id="reg-phone" placeholder="Telefon (isteğe bağlı)" class="input-field pl-11" autocomplete="tel" />
        </div>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="password" id="reg-password" placeholder="Şifre (en az 6 karakter)" class="input-field" required minlength="6" autocomplete="new-password" />
          <button type="button" onclick="togglePwd('reg-password',this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <i class="fa-regular fa-eye text-sm"></i>
          </button>
        </div>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="password" id="reg-password2" placeholder="Şifreyi tekrar girin" class="input-field" required autocomplete="new-password" />
          <button type="button" onclick="togglePwd('reg-password2',this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <i class="fa-regular fa-eye text-sm"></i>
          </button>
        </div>

        <div class="flex items-start gap-3 pt-1">
          <input type="checkbox" id="terms-check" required class="mt-1 w-4 h-4 accent-blue-600 cursor-pointer shrink-0" />
          <label for="terms-check" class="text-xs text-slate-500 leading-relaxed">
            <a href="kullanici-sozlesmesi.html" class="text-blue-600 font-bold hover:underline">Kullanıcı Sözleşmesi</a>'ni ve
            <a href="gizlilik.html" class="text-blue-600 font-bold hover:underline">Gizlilik Politikası</a>'nı okudum, kabul ediyorum.
          </label>
        </div>

        <button type="submit" id="reg-btn" class="btn-primary mt-2">
          Hesap Oluştur
        </button>
      </form>

    </div>

    <p class="text-center text-sm text-slate-500 font-medium mt-6">
      Zaten hesabın var mı?
      <a href="giris.html" class="text-blue-600 font-bold hover:underline ml-1">Giriş Yap</a>
    </p>

  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    let selectedRole = 'worker';
    let googleClientId = '';

    async function loadGoogleConfig() {
      try {
        const cfg = await fetch('/api/auth/config').then(r => r.json());
        googleClientId = cfg.google_client_id || '';
        if (googleClientId) initGoogle();
        else document.getElementById('google-fallback-btn').classList.remove('hidden');
      } catch { document.getElementById('google-fallback-btn').classList.remove('hidden'); }
    }

    function initGoogle() {
      if (!window.google) { setTimeout(initGoogle, 300); return; }
      google.accounts.id.initialize({ client_id: googleClientId, callback: handleGoogleCredential });
      google.accounts.id.renderButton(
        document.getElementById('google-gsi-btn'),
        { theme: 'outline', size: 'large', width: 352, text: 'signup_with', shape: 'rectangular' }
      );
    }

    async function handleGoogleCredential(response) {
      try {
        const data = await apiPost('/api/auth/google', { credential: response.credential });
        if (data.success) {
          localStorage.setItem('gu_user', JSON.stringify(data.user));
          showToast('Hoş geldin, ' + data.user.full_name + '!');
          setTimeout(() => window.location.href = 'index.html', 800);
        }
      } catch (err) { showToast(err.message, 'error'); }
    }

    function googleSignIn() {
      if (!googleClientId) { showToast('Google OAuth yapılandırılmamış', 'error'); return; }
      if (window.google) google.accounts.id.prompt();
    }

    function selectRole(role, el) {
      selectedRole = role;
      document.getElementById('selected-role').value = role;
      document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const pass = document.getElementById('reg-password').value;
      const pass2 = document.getElementById('reg-password2').value;

      if (pass !== pass2) { showToast('Şifreler eşleşmiyor', 'error'); return; }

      try {
        setLoading(true);
        const data = await apiPost('/api/auth/register', {
          full_name: name, email, phone: phone || null, password: pass, role: selectedRole
        });
        if (data.success) {
          localStorage.setItem('gu_user', JSON.stringify(data.user));
          showToast('Hesabın oluşturuldu! Hoş geldin 🎉');
          setTimeout(() => window.location.href = 'index.html', 900);
        }
      } catch (err) {
        showToast(err.message, 'error');
        setLoading(false);
      }
    }

    function setLoading(on) {
      const btn = document.getElementById('reg-btn');
      btn.disabled = on;
      btn.innerHTML = on ? '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Kaydediliyor...' : 'Hesap Oluştur';
    }

    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      const isText = inp.type === 'text';
      inp.type = isText ? 'password' : 'text';
      btn.querySelector('i').className = isText ? 'fa-regular fa-eye text-sm' : 'fa-regular fa-eye-slash text-sm';
    }

    window.addEventListener('DOMContentLoaded', loadGoogleConfig);
  </script>
</body>
</html>
